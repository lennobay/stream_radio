<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/index.css">

</head>

<body>


    <p class="back-button" onclick="window.location.href = '/'"> <i class="fa-solid fa-arrow-left-long"></i> Zum Radio
    </p>

    <h2 style="display: flex; align-items: center; justify-content: center; color: #0d3030;">Liedwünsche</h2>

    <info>
        <p><a href="/impressum">Impressum</a> | <a href="">Contribution</a></p>
        <p>Designed by Human, no AI | created & hosted by <a href="https://haufenet.com">haufenet.com</a></p>
    </info>
    <script>

        fetch("https://api-rmbg.viewdns.net/auth/session", {
            "method": "GET",
            "credentials": "include",
        }).then((data) => {
        })


        fetch("https://api.haufenet.com/unprotected/all").then((data) => { return data.json() }).then((res) => {
            for (let i = 0; i < res.length; i++) {
                const temp = res[i]
                document.querySelector("display-wishes").innerHTML += `
                    <div class="display-wishes-sub">
                        <p><strong>Liedname:</strong> ${temp[0].title}</p>
                        <p><strong>Interpret:</strong> ${temp[0].interpreter}</p>
                        <button onclick="del(${temp[0].id})"> Löschen</button>
    
                        </div>
                    
                
                
                `


            }
        })
        function del(id) {
            fetch("https://api-rmbg.viewdns.net/protected/delete?id=" + id, {
                "method": "GET",
                "credentials": "include"
            }).then(() => {window.location.href="/portal/view"})
        }





        const musicinput = document.querySelector("form")






    </script>
    <style>
        .display-wishes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .display-wishes-sub p{
            font-size: 1.4rem;
            color: #0d3030;
        }
        .display-wishes-sub{
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            background-color: #2d8383;
            padding: 1rem;
            border-radius: 2rem;


        }
        .display-wishes-sub button{
            background-color: #103939;
            border: none;
            font-size: 1.5rem;
            color: #3daeae;
            border-radius: 1.8rem;
            
        }
        form-outer {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }

        form {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 1rem;
            max-width: 400px;
        }

        .form-normal-input {
            background-color: #329b9b;
            border: none;
            color: #103939;
            font-weight: bold;
            border-radius: 2rem;
            padding: 1rem;
            font-size: 1.4rem;
        }

        .form-normal-input:focus {
            outline: none;
        }

        .form-submit-input {
            background-color: #226363;
            border: none;
            color: #55e2e2;
            font-weight: bold;
            border-radius: 2rem;
            padding: 1rem;
            font-size: 1.5rem;
        }
    </style>
